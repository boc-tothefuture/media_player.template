name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  test:
    name: Unit tests
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: "astral-sh/setup-uv@v5"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: |
          uv pip install --system homeassistant pytest pytest-homeassistant-custom-component
      - name: Run pytest
        run: |
          pytest
